<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قتال الغروب</title>
<style>
:root{--bg:#14061f;--ink:#ffe3c2;--btn:#3a1330;--btn2:#ff7a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;user-select:none;-webkit-user-select:none}
.scr{display:none;position:fixed;inset:0;overflow:auto;flex-direction:column;align-items:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 80%,#ffe9a8 0,#ff9a4a 14%,#e8505b 34%,#6a2a74 62%,#1a0b3a 100%)}
.scr.on{display:flex}
h1{margin:14px 0 0;font-size:36px;text-shadow:0 2px 12px #000a}
h2{margin:6px 0;font-size:24px;text-shadow:0 2px 10px #000a}
p.sub{margin:0 0 10px;opacity:.9}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid #7a2f5a;border-radius:12px;padding:12px 18px;cursor:pointer;touch-action:manipulation}
button.go,button.sel{background:var(--btn2);color:#1a0612;border-color:var(--btn2)}
button:disabled{opacity:.5}
.menu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.menu button{font-size:19px;padding:15px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:440px;background:#000a;padding:10px 12px;border-radius:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:9px 12px;font-size:14px}
.coins{font-size:20px;background:#000a;padding:6px 16px;border-radius:20px}
.card{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;background:#000a;padding:12px;border-radius:12px}
.card .ic{font-size:36px}.card .in{flex:1;font-size:13px;line-height:1.7}.card b{font-size:17px}
#game{display:none;flex-direction:column;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#game.on{display:flex}
#wrap{position:relative;width:100%;max-width:860px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,6,31,.6);border-radius:10px;font-size:clamp(18px,5vw,34px);font-weight:700;text-align:center}
#pad{display:flex;justify-content:space-between;width:100%;max-width:860px;gap:10px}
.grp{display:flex;gap:8px}
.grp button{width:62px;height:62px;padding:0;font-size:15px;touch-action:none}
#hint{font-size:12px;opacity:.8;max-width:860px;text-align:center;line-height:1.7;margin:0}
</style>
</head>
<body>

<div class="scr on" id="home">
  <h1>⚔️ قتال الغروب</h1>
  <p class="sub">مبارزة كونغ فو عند الغروب</p>
  <div class="coins" id="hc">🪙 0</div>
  <div class="menu">
    <button class="go" onclick="startDuel()">⚔️ ابدأ المبارزة</button>
    <button onclick="go('shop')">🛒 المتجر</button>
    <button onclick="go('settings')">⚙️ الإعدادات</button>
  </div>
</div>

<div class="scr" id="settings">
  <h2>⚙️ الإعدادات</h2>
  <div class="row"><span>🎵 الموسيقى</span><button id="mus" onclick="tg('music')"></button></div>
  <div class="row"><span>🔊 المؤثرات الصوتية</span><button id="sfxb" onclick="tg('sfx')"></button></div>
  <div class="row"><span>🥋 صعوبة الخصم</span>
    <div class="seg">
      <button id="d_easy" onclick="sd('easy')">سهل</button>
      <button id="d_medium" onclick="sd('medium')">متوسط</button>
      <button id="d_hard" onclick="sd('hard')">صعب</button>
    </div>
  </div>
  <div class="row"><span>👤 الخصم</span><button id="opp" onclick="tg('cpu')"></button></div>
  <p class="sub" style="font-size:12px">العملات تُكسب عند الفوز على الكمبيوتر فقط</p>
  <button class="go" onclick="go('home')">رجوع</button>
</div>

<div class="scr" id="shop">
  <h2>🛒 المتجر</h2>
  <div class="coins" id="sc">🪙 0</div>
  <div id="list" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center"></div>
  <button class="go" onclick="go('home')">رجوع</button>
</div>

<div id="game">
  <div style="display:flex;gap:8px;width:100%;max-width:860px;justify-content:space-between;align-items:center">
    <button onclick="go('home')" style="padding:8px 14px;font-size:14px">☰ القائمة</button>
    <span id="gc" class="coins" style="font-size:15px;padding:4px 12px">🪙 0</span>
  </div>
  <div id="wrap">
    <canvas id="c" width="800" height="400"></canvas>
    <div id="ov"><div id="msg"></div>
      <button class="go" onclick="reset()">جولة جديدة</button>
      <button onclick="go('home')">القائمة الرئيسية</button>
    </div>
  </div>
  <div id="pad" dir="ltr">
    <div class="grp"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">قفز</button></div>
    <div class="grp"><button data-k="s">صد</button><button data-k="f" id="bpunch">لكمة</button><button data-k="g">ركلة</button></div>
  </div>
  <p id="hint">اللاعب 1: A D حركة، W قفز، S صد، F لكمة أو سلاح، G ركلة.<br>اللاعب 2 (وضع لاعبين): الأسهم حركة، ↓ صد، J لكمة، K ركلة.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),ov=$('ov'),msg=$('msg');
const W=800,H=400,G=335,keys={};

/* ===== الحفظ ===== */
const S={coins:0,own:{},eq:'',music:1,sfx:1,diff:'medium',cpu:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('kfs')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('kfs',JSON.stringify(S))}catch(e){}}

/* ===== البيانات ===== */
const DIFF={
  easy:{tm:1.8,blk:.2,att:.5,sp:2.4,dm:.7,rw:30},
  medium:{tm:1,blk:.5,att:1,sp:3.1,dm:1,rw:50},
  hard:{tm:.55,blk:.8,att:1.5,sp:3.7,dm:1.3,rw:90}};
const BASE={
  punch:{dur:18,act:[6,10],reach:78,dmg:6,swing:'whoosh',hit:'punch'},
  kick:{dur:26,act:[10,15],reach:88,dmg:9,swing:'whoosh',hit:'kick'}};
const WP={
  knife:{n:'سكين',ic:'🔪',price:40,dur:14,act:[4,7],reach:62,dmg:8,base:-30,sw:40,len:34,swing:'knife',hit:'knifeHit',info:'سريع ومدى قصير • ضرر 8'},
  staff:{n:'عصا',ic:'🦯',price:70,dur:22,act:[7,12],reach:120,dmg:10,base:-70,sw:75,len:90,swing:'staff',hit:'staffHit',info:'مدى طويل • ضرر 10'},
  sword:{n:'سيف',ic:'🗡️',price:120,dur:24,act:[8,13],reach:105,dmg:14,base:-60,sw:100,len:90,swing:'sword',hit:'swordHit',info:'ضرر عالٍ ومدى جيد • ضرر 14'}};
const WD={
  knife(){ctx.fillStyle='#3a1a0a';ctx.fillRect(-6,-3,12,6);ctx.fillStyle='#e8eef8';ctx.beginPath();ctx.moveTo(6,-4);ctx.lineTo(34,0);ctx.lineTo(6,3);ctx.fill()},
  staff(){ctx.fillStyle='#c98a4b';ctx.fillRect(-35,-3,125,6);ctx.fillStyle='#7a4a1e';ctx.fillRect(-35,-3,7,6);ctx.fillRect(83,-3,7,6)},
  sword(){ctx.fillStyle='#5a2a14';ctx.fillRect(-8,-2.5,14,5);ctx.fillStyle='#e0b040';ctx.fillRect(6,-8,4,16);ctx.fillStyle='#e8eef8';ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(80,-2);ctx.lineTo(90,0);ctx.lineTo(80,2);ctx.lineTo(10,4);ctx.fill()}};

/* ===== الصوت ===== */
let AC=null,mi=0,mt=null,mn=3;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(type,f1,f2,dur,vol){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,f,q,f2){const a=ac();if(!a)return;const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;const t=a.currentTime;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t)}
const SND={
  punch(){tone('sine',170,50,.12,.5);noise(.06,.35,900,1)},
  kick(){tone('sine',120,35,.18,.7);noise(.1,.45,500,1)},
  block(){tone('square',900,700,.06,.12);noise(.04,.2,3000,2)},
  whoosh(){noise(.18,.15,600,.8,2200)},
  sword(){noise(.35,.2,3000,3,6000);tone('sawtooth',1400,2600,.25,.07);tone('triangle',2800,2000,.3,.05)},
  swordHit(){tone('square',1200,900,.15,.2);tone('sawtooth',2400,1800,.3,.1);noise(.08,.4,2500,2)},
  staff(){noise(.22,.25,300,1,900)},
  staffHit(){tone('square',260,120,.12,.4);noise(.05,.5,1200,2)},
  knife(){noise(.1,.25,5000,4,9000)},
  knifeHit(){noise(.07,.5,4000,3);tone('triangle',1800,900,.1,.2)},
  coin(){tone('square',988,988,.08,.12);setTimeout(()=>tone('square',1319,1319,.25,.12),90)},
  ko(){tone('sawtooth',300,50,.8,.25);noise(.5,.3,300,1)},
  click(){tone('triangle',700,500,.06,.12)},
  no(){tone('square',200,150,.15,.12)}};
function snd(n){if(S.sfx&&SND[n])SND[n]()}
function musicStart(){
  if(mt||!ac())return;
  mt=setInterval(()=>{
    if(!S.music||!AC||AC.state!=='running')return;
    mi++;const sc=[0,2,3,7,8,12,14,15];
    if(mi%4===0){tone('sine',90,40,.15,.1);tone('triangle',(mi%8===0?110:82.4),(mi%8===0?110:82.4),.5,.08)}
    if(mi%2===1)noise(.04,.03,6000,1);
    if(Math.random()<.65){mn=Math.max(0,Math.min(7,mn+Math.floor(Math.random()*5)-2));const f=220*Math.pow(2,sc[mn]/12);tone('triangle',f,f*.99,.4,.06)}
  },280);
}
addEventListener('pointerdown',()=>{ac();musicStart()});

/* ===== الإدخال ===== */
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=1;b.style.background='#ff7a3d'};
  const off=e=>{e.preventDefault();keys[k]=0;b.style.background=''};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
});

/* ===== القوائم ===== */
let scene='home';
function go(n){
  scene=n;
  document.querySelectorAll('.scr,#game').forEach(e=>e.classList.remove('on'));
  $(n).classList.add('on');
  if(n==='shop')drawShop();
  if(n==='settings')drawSet();
  if(n==='home')$('hc').textContent='🪙 '+S.coins;
  snd('click');
}
function startDuel(){go('game');reset()}
function tg(k){S[k]=S[k]?0:1;save();drawSet();snd('click')}
function sd(k){S.diff=k;save();drawSet();snd('click')}
function drawSet(){
  $('mus').textContent=S.music?'تشغيل':'إطفاء';$('mus').className=S.music?'sel':'';
  $('sfxb').textContent=S.sfx?'تشغيل':'إطفاء';$('sfxb').className=S.sfx?'sel':'';
  ['easy','medium','hard'].forEach(k=>$('d_'+k).className=S.diff===k?'sel':'');
  $('opp').textContent=S.cpu?'الكمبيوتر':'لاعب ثانٍ';
}
function drawShop(){
  $('sc').textContent='🪙 '+S.coins;
  let h='<div class="card"><div class="ic">👊</div><div class="in"><b>بدون سلاح</b><br>اللكمات العادية</div><button '+(S.eq?'':'class="sel" ')+'onclick="eq(\'\')">'+(S.eq?'تجهيز':'مجهّز ✓')+'</button></div>';
  for(const k in WP){
    const w=WP[k],o=S.own[k];
    h+='<div class="card"><div class="ic">'+w.ic+'</div><div class="in"><b>'+w.n+'</b><br>'+w.info+'</div>'+
      (o?'<button '+(S.eq===k?'class="sel" ':'')+'onclick="eq(\''+k+'\')">'+(S.eq===k?'مجهّز ✓':'تجهيز')+'</button>'
        :'<button class="go" onclick="buy(\''+k+'\')">🪙 '+w.price+'</button>')+'</div>';
  }
  $('list').innerHTML=h;
}
function buy(k){const w=WP[k];if(S.coins<w.price){snd('no');return}S.coins-=w.price;S.own[k]=1;S.eq=k;save();snd('coin');drawShop()}
function eq(k){S.eq=k;save();snd('click');drawShop()}

/* ===== اللعبة ===== */
function mk(id,x,f){return{id,x,y:G,vx:0,vy:0,f,hp:100,atk:null,block:false,hit:0,kb:0,walk:0,fall:0,cd:0,tr:[],P:null,cr:null,sp:3.2,dm:1,wp:null,wa:null}}
let p1,p2,over,sparks=[],parts=[],stop=0,shake=0,slow=0,time=0,ai={t:0,i:{}};
function reset(){
  const D=DIFF[S.diff];
  p1=mk(1,220,1);p2=mk(2,580,-1);
  p1.wp=S.eq||null;p2.sp=S.cpu?D.sp:3.2;p2.dm=S.cpu?D.dm:1;
  over=false;sparks=[];parts=[];stop=0;shake=0;slow=0;ai={t:0,i:{}};
  ov.style.display='none';$('bpunch').textContent=S.eq?'سلاح':'لكمة';$('gc').textContent='🪙 '+S.coins;
}
reset();
function dust(x,y){for(let i=0;i<6;i++)parts.push({x:x+(Math.random()-.5)*20,y:y-2,vx:(Math.random()-.5)*3,vy:-Math.random()*1.5,t:0})}
function ease(p){if(p<.22)return -.3*Math.sin(p/.22*Math.PI/2);if(p<.4){const q=(p-.22)/.18;return -.3+1.3*(1-(1-q)*(1-q))}const q=(p-.4)/.6;return 1-q*q*(3-2*q)}
function trail(f){for(let i=1;i<f.tr.length;i++){ctx.strokeStyle='rgba(255,240,200,'+(i/f.tr.length*.6)+')';ctx.lineWidth=2+i*1.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.tr[i-1][0],f.tr[i-1][1]);ctx.lineTo(f.tr[i][0],f.tr[i][1]);ctx.stroke()}}
function startAtk(f,type){
  const w=type==='wp'?WP[f.wp]:null,b=w||BASE[type];
  f.atk={t:0,type,done:0,dur:b.dur,a0:b.act[0],a1:b.act[1],reach:b.reach,dmg:b.dmg,hit:b.hit};
  snd(b.swing);
}
function inp1(){return{l:keys.a,r:keys.d,up:keys.w,block:keys.s,punch:keys.f,kick:keys.g}}
function inp2(){return{l:keys.arrowleft,r:keys.arrowright,up:keys.arrowup,block:keys.arrowdown,punch:keys.j,kick:keys.k}}
function cpu(){
  const D=DIFF[S.diff],d=p1.x-p2.x,dist=Math.abs(d);
  if(ai.t>0){ai.t--;return ai.i}
  const tw=d>0?{r:1}:{l:1},aw=d>0?{l:1}:{r:1};
  let i={},r=Math.random(),a=D.att,t=10;
  if(dist>100){i=tw;t=8+Math.random()*10}
  else if(p1.atk&&r<D.blk){i={block:1};t=18}
  else{
    r=Math.random();const c=.52*a;
    if(r<.3*a){i={punch:1};t=8}
    else if(r<c){i={kick:1};t=10}
    else if(r<c+.15){i={block:1};t=20}
    else if(r<c+.28){i=aw;t=14}
    else if(r<c+.36){i={up:1,...tw};t=6}
  }
  ai.t=t*D.tm;ai.i=i;return i;
}
function step(f,o,I){
  const air=f.y<G;
  if(f.hp<=0){f.fall=Math.min(1,f.fall+.04);f.vy+=.6;f.y=Math.min(G,f.y+f.vy);if(f.y>=G)f.vy=0;return}
  if(f.hit>0){f.hit--;f.x+=f.kb;f.kb*=.85;f.vx=0}
  else if(!f.atk){
    f.block=!!I.block&&!air;
    f.vx+=((f.block?0:((I.r?1:0)-(I.l?1:0))*f.sp)-f.vx)*(air?.04:.2);
    if(f.cd>0)f.cd--;
    if(!f.block){
      if(I.up&&!air){f.vy=-11.5;dust(f.x,G)}
      if(f.cd<=0){if(I.punch)startAtk(f,f.wp?'wp':'punch');else if(I.kick)startAtk(f,'kick')}
    }
  }
  if(f.atk){
    const a=f.atk;a.t++;
    if(a.t<9)f.x+=f.f*(a.type==='kick'?1.6:1.2);
    f.vx*=.85;
    if(!a.done&&a.t>=a.a0&&a.t<=a.a1){
      const dx=(o.x-f.x)*f.f;
      if(dx>0&&dx<a.reach&&Math.abs(o.y-f.y)<55&&o.hp>0){
        a.done=1;
        const blocked=o.block&&o.f===-f.f,hy=o.y-(a.type==='kick'?60:100);
        if(blocked){o.hp-=1;o.vx+=f.f*3.5;sparks.push({x:o.x-f.f*10,y:hy,t:0,c:'#ffd27a'});stop=3;shake=3;snd('block')}
        else{
          const K=a.type==='kick'||a.dmg>=10;
          o.hp-=a.dmg*f.dm;o.hit=18;o.block=false;o.kb=f.f*(K?8:6);o.atk=null;
          o.vy=a.type==='kick'?-3:0;
          sparks.push({x:o.x-f.f*8,y:hy,t:0,c:'#fff'});
          stop=K?7:5;shake=K?8:5;dust(o.x,G);snd(a.hit);
        }
      }
    }
    if(a.t>=a.dur){f.atk=null;f.cd=5}
  }
  f.vy+=.6;f.y+=f.vy;
  if(f.y>=G){if(f.vy>6)dust(f.x,G);f.y=G;f.vy=0}
  f.x=Math.max(40,Math.min(W-40,f.x+f.vx));
  if(f.y>=G&&!f.atk&&f.hit<=0)f.f=o.x>=f.x?1:-1;
  f.walk+=Math.abs(f.vx)*.09;
}
function separate(){
  const d=p2.x-p1.x;
  if(Math.abs(d)<34&&Math.abs(p1.y-p2.y)<40){
    const push=(34-Math.abs(d))/2*(d>=0?1:-1);p1.x-=push;p2.x+=push;
  }
}

/* ===== الرسم ===== */
function ik(ox,oy,tx,ty,l1,l2,bend){
  let dx=tx-ox,dy=ty-oy,d=Math.hypot(dx,dy),m=l1+l2-.5;
  if(d>m){tx=ox+dx/d*m;ty=oy+dy/d*m;d=m;dx=tx-ox;dy=ty-oy}
  const a=Math.atan2(dy,dx),c=Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*Math.max(d,1))));
  const ang=a+bend*Math.acos(c);
  return[ox+Math.cos(ang)*l1,oy+Math.sin(ang)*l1,tx,ty];
}
function limb(ox,oy,tx,ty,l1,l2,bend,w){
  const[jx,jy,ex,ey]=ik(ox,oy,tx,ty,l1,l2,bend);
  ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(jx,jy);ctx.lineTo(ex,ey);ctx.stroke();
  if(w<10){ctx.beginPath();ctx.arc(ex,ey,w*.6,0,7);ctx.fill()}
  return[ex,ey];
}
function drawW(f,x,y){
  const w=WP[f.wp],at=f.atk&&f.atk.type==='wp';
  let an=w.base;
  if(at)an+=ease(f.atk.t/f.atk.dur)*w.sw;else if(f.block)an=-95;else if(f.hit>0||f.hp<=0)an=-120;
  f.wa=(at||f.wa==null)?an:f.wa+(an-f.wa)*.25;
  ctx.save();ctx.translate(x,y);ctx.rotate(f.wa*Math.PI/180);WD[f.wp]();ctx.restore();
}
function drawF(f){
  const hg=G-f.y;
  ctx.fillStyle='rgba(0,0,0,'+Math.max(0,.35-hg/600)+')';ctx.beginPath();ctx.ellipse(f.x,G+5,Math.max(10,34-hg/10),7,0,0,7);ctx.fill();
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.f,1);
  if(f.hp<=0)ctx.rotate(-f.fall*Math.PI/2);
  ctx.strokeStyle=ctx.fillStyle='#000';ctx.lineCap='round';ctx.lineJoin='round';
  const air=f.y<G;
  let fh=[34,-98],bh=[18,-92],ff=[26,0],bf=[-24,0],lean=5;
  if(f.hp<=0||f.hit>0){lean=-12;fh=[8,-92];bh=[-2,-86];ff=[16,0];bf=[-22,0]}
  else if(f.atk&&f.atk.type!=='kick'){
    const e=ease(f.atk.t/f.atk.dur);
    fh=[30+e*32,-104];bh=[10,-96];lean=4+e*8;ff=[28,0];bf=[-24,0];
  }else if(f.atk){
    const e=ease(f.atk.t/f.atk.dur);
    ff=[22+e*40,-8-(e>0?e*80:-e*110)];bf=[-14,0];lean=-8*e;fh=[18,-108];bh=[-12,-100];
  }else if(f.block){fh=[26,-118];bh=[36,-104];lean=-2;ff=[24,0];bf=[-22,0]}
  else if(air){ff=[26,-42];bf=[-8,-30];fh=[30,-108];bh=[12,-102]}
  else if(Math.abs(f.vx)>.1){
    const s=Math.sin(f.walk);
    ff=[12+s*26,-Math.max(0,-s)*14];bf=[-12-s*26,-Math.max(0,s)*14];
  }
  const T=[fh[0],fh[1],bh[0],bh[1],ff[0],ff[1],bf[0],bf[1],lean];
  if(!f.P)f.P=T.slice();
  const k=1-Math.pow(1-((f.atk&&f.atk.t<12)?.5:(f.hit>0?.45:.2)),DT);
  for(let i=0;i<9;i++)f.P[i]+=(T[i]-f.P[i])*k;
  fh=[f.P[0],f.P[1]];bh=[f.P[2],f.P[3]];ff=[f.P[4],f.P[5]];bf=[f.P[6],f.P[7]];lean=f.P[8];
  const crouch=air?0:f.block?14:f.atk?(f.atk.type==='kick'?2:7):Math.abs(f.vx)>.5?8:10+Math.sin(time*.07+f.id)*1.5;
  f.cr=(f.cr==null?crouch:f.cr+(crouch-f.cr)*k);
  const hip=[0,-66+f.cr],neck=[lean,-112+f.cr*.9],sh=[lean,-102+f.cr*.9];
  if(f.atk&&f.atk.t>=3&&f.atk.t<=17){
    let q;
    if(f.atk.type==='kick')q=[ff[0],ff[1]];
    else if(f.atk.type==='wp'){const w=WP[f.wp],an=(w.base+ease(f.atk.t/f.atk.dur)*w.sw)*Math.PI/180;q=[fh[0]+Math.cos(an)*w.len,fh[1]+f.cr*.9+Math.sin(an)*w.len]}
    else q=[fh[0],fh[1]+f.cr*.9];
    f.tr.push([f.x+q[0]*f.f,f.y+q[1]]);
  }
  if(f.tr.length>(f.atk?7:0))f.tr.shift();
  limb(hip[0],hip[1],bf[0],bf[1],34,34,-1,10);
  limb(sh[0],sh[1],bh[0],bh[1]+f.cr*.9,28,28,1,9);
  ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(hip[0],hip[1]);ctx.lineTo(neck[0],neck[1]);ctx.stroke();
  limb(hip[0],hip[1],ff[0],ff[1],34,34,-1,10);
  const hx=neck[0]+3,hy=neck[1]-13;
  ctx.beginPath();ctx.arc(hx,hy,12,0,7);ctx.fill();
  if(f.id===2){
    const w=Math.sin(time*.2)*4;
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hx-10,hy-2);ctx.quadraticCurveTo(hx-24,hy+w,hx-34,hy+6+w);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hx-10,hy-2);ctx.quadraticCurveTo(hx-22,hy-8-w,hx-32,hy-4-w);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(hx-5,hy-10);ctx.lineTo(hx-3,hy-20);ctx.lineTo(hx+3,hy-10);ctx.fill();
  }
  const hd=limb(sh[0],sh[1],fh[0],fh[1]+f.cr*.9,28,28,1,9);
  if(f.wp)drawW(f,hd[0],hd[1]);
  ctx.restore();
}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,G);
  g.addColorStop(0,'#1a0b3a');g.addColorStop(.35,'#6a2a74');g.addColorStop(.65,'#e8505b');g.addColorStop(.88,'#ff9a4a');g.addColorStop(1,'#ffcf6e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sg=ctx.createRadialGradient(400,290,10,400,290,230);
  sg.addColorStop(0,'rgba(255,240,170,.9)');sg.addColorStop(.3,'rgba(255,170,80,.45)');sg.addColorStop(1,'rgba(255,120,60,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,40,W,300);
  ctx.fillStyle='#fff1b8';ctx.beginPath();ctx.arc(400,292,62,Math.PI,0);ctx.fill();
  ctx.fillStyle='rgba(120,30,80,.55)';
  [[60,110,260,7],[430,90,300,6],[180,150,220,5],[520,175,240,6],[20,205,180,4],[600,230,190,5]].forEach(c=>{
    const x=c[0]+Math.sin(time*.004+c[1])*14;
    ctx.beginPath();ctx.ellipse(x+c[2]/2,c[1],c[2]/2,c[3],0,0,7);ctx.fill();
  });
  ctx.fillStyle='#4a1a52';
  ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(0,260);ctx.lineTo(90,215);ctx.lineTo(170,262);ctx.lineTo(260,225);ctx.lineTo(340,290);ctx.lineTo(340,G);ctx.fill();
  ctx.beginPath();ctx.moveTo(470,G);ctx.lineTo(470,285);ctx.lineTo(560,232);ctx.lineTo(650,270);ctx.lineTo(730,210);ctx.lineTo(800,255);ctx.lineTo(800,G);ctx.fill();
  ctx.fillStyle='#2d0f3a';
  ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(0,295);ctx.lineTo(120,270);ctx.lineTo(230,300);ctx.lineTo(300,G);ctx.fill();
  ctx.beginPath();ctx.moveTo(520,G);ctx.lineTo(600,300);ctx.lineTo(700,275);ctx.lineTo(800,305);ctx.lineTo(800,G);ctx.fill();
  const gg=ctx.createLinearGradient(0,G,0,H);gg.addColorStop(0,'#7a2a3c');gg.addColorStop(1,'#2a0a1e');
  ctx.fillStyle=gg;ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle='rgba(255,190,110,.5)';ctx.fillRect(0,G,W,2);
}
function hud(){
  const bw=320,x1=20,x2=W-20-bw;
  [[p1,x1,false,'اللاعب 1'],[p2,x2,true,S.cpu?'الكمبيوتر':'اللاعب 2']].forEach(([p,x,rtl,n])=>{
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-2,16,bw+4,18);
    const w=Math.max(0,p.hp)/100*bw;
    ctx.fillStyle=p.hp>35?'#ffb347':'#ff4b4b';
    ctx.fillRect(rtl?x+bw-w:x,18,w,14);
    ctx.fillStyle='#fff1d6';ctx.font='bold 14px Tahoma,Arial';ctx.textAlign=rtl?'right':'left';
    ctx.fillText(n,rtl?x+bw:x,52);
  });
}

/* ===== الحلقة ===== */
function sim(){
  if(stop>0){stop--;return}
  if(slow>0){slow--;if(slow%2)return}
  time++;
  if(!over){
    step(p1,p2,inp1());
    step(p2,p1,S.cpu?cpu():inp2());
    separate();
    if(p1.hp<=0||p2.hp<=0){
      over=true;slow=80;shake=10;snd('ko');
      const win=p1.hp>0;let extra='';
      if(win&&S.cpu){const r=DIFF[S.diff].rw;S.coins+=r;save();extra=' +'+r+' 🪙'}
      setTimeout(()=>{
        snd(win&&S.cpu?'coin':'click');
        msg.textContent=(win?'فاز اللاعب 1!':(S.cpu?'فاز الكمبيوتر!':'فاز اللاعب 2!'))+extra;
        $('gc').textContent='🪙 '+S.coins;ov.style.display='flex';
      },900);
    }
  }else{step(p1,p2,{});step(p2,p1,{})}
}
function render(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
  bg();drawF(p1);drawF(p2);trail(p1);trail(p2);
  parts=parts.filter(q=>q.t<24);
  parts.forEach(q=>{q.t++;q.x+=q.vx;q.y+=q.vy;q.vy*=.9;q.vx*=.92;ctx.fillStyle='rgba(255,200,140,'+(.5-q.t/50)+')';ctx.beginPath();ctx.arc(q.x,q.y,3+q.t*.15,0,7);ctx.fill()});
  sparks=sparks.filter(s=>s.t<10);
  sparks.forEach(s=>{s.t++;ctx.strokeStyle=s.c;ctx.lineWidth=3;
    for(let i=0;i<8;i++){const a=i*Math.PI/4,r1=4+s.t*2,r2=r1+8;
      ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*r1,s.y+Math.sin(a)*r1);ctx.lineTo(s.x+Math.cos(a)*r2,s.y+Math.sin(a)*r2);ctx.stroke()}});
  hud();
  ctx.restore();
}
let last=performance.now(),acc=0,DT=1;
function loop(now){
  const d=Math.min(100,now-last);last=now;
  if(scene==='game'){
    DT=d/16.667;acc+=d;let n=0;
    while(acc>=16.667&&n<5){sim();acc-=16.667;n++}
    if(n>=5)acc=0;
    render();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
go('home');
</script>
